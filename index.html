<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light only">
<title>Gata.md — доска объявлений Молдовы</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/styles.css">
</head>
<body>

<div class="topbar"><div class="wrap">
  <i data-lucide="map-pin" style="width:14px;height:14px"></i>
  <select id="regionTop"></select>
  <span class="sp"></span>
  <a href="#" class="hide-s" data-i="help">Помощь</a>
  <a href="#" class="hide-s" data-i="rules">Правила</a>
  <div class="lang"><button data-l="ru" class="on">RU</button><button data-l="ro">RO</button></div>
  <a href="#" id="loginLink" data-i="login">Войти</a>
</div></div>

<header><div class="wrap">
  <a href="#" class="logo" id="home"><span class="mk"><i data-lucide="check"></i></span>gata<small>.md</small></a>
  <button class="catbtn" id="allCats"><i data-lucide="layout-grid"></i><span data-i="allcats">Все категории</span></button>
  <form class="search" id="sform"><input id="q" autocomplete="off" data-ip="search"><button class="go"><i data-lucide="search"></i><span data-i="find">Найти</span></button></form>
  <button class="aibtn" id="aiBtn" type="button"><i data-lucide="sparkles"></i><span data-i="askai">Спросить ИИ</span></button>
  <button class="hicon" id="favBtn" title="♥"><i data-lucide="heart"></i><span class="badge" id="favN" hidden>0</span></button>
  <button class="hicon" id="msgBtn" data-it="msgs"><i data-lucide="message-circle"></i><span class="badge" id="msgN" hidden>0</span></button>
  <button class="hicon" id="cabBtn" data-it="cabinet"><i data-lucide="circle-user"></i></button>
  <button class="post" id="postBtn"><i data-lucide="plus"></i><span data-i="post">Подать объявление</span></button>
</div></header>

<section class="hero"><div class="wrap"><div class="hero-in">
  <div class="hero-top">
    <div><h1 data-i="h1"></h1><p data-i="h1s"></p></div>
    <div class="aistrip" id="aiStrip"><span class="sp"><i data-lucide="sparkles"></i></span><div><b data-i="aistrip1"></b><span data-i="aistrip2"></span></div></div>
  </div>
  <div class="cats" id="cats"></div>
</div></div></section>

<div class="wrap main">
  <aside id="aside">
    <button class="aside-x" id="asideX" type="button"><i data-lucide="x"></i></button>
    <h3 data-i="price">Цена</h3>
    <div class="row2"><input class="fld" id="pmin" type="number" min="0"><input class="fld" id="pmax" type="number" min="0"></div>
    <div class="chips" style="margin-top:8px" id="cur"><button class="chip on" data-c="MDL">лей</button><button class="chip" data-c="EUR">€</button></div>
    <h3 data-i="region">Регион</h3>
    <select class="fld" id="region"></select>
    <h3 data-i="cond">Состояние</h3>
    <div class="chips" id="cond"><button class="chip on" data-v="all" data-i="anyN">Любое</button><button class="chip" data-v="new" data-i="new">Новое</button><button class="chip" data-v="used" data-i="used">Б/у</button></div>
    <h3 data-i="more">Дополнительно</h3>
    <label class="chk"><input type="checkbox" id="fPhoto"><span data-i="withphoto"></span></label>
    <label class="chk"><input type="checkbox" id="fPrivate"><span data-i="private"></span></label>
    <label class="chk"><input type="checkbox" id="fDeal"><span data-i="dealOnly"></span></label>
    <label class="chk"><input type="checkbox" id="fDel"><span data-i="withDelivery"></span></label>
    <label class="chk"><input type="checkbox" id="fVer"><span data-i="verifiedOnly"></span></label>
    <div class="adv" id="adv"></div>
    <button class="reset" id="reset" data-i="reset">Сбросить фильтры</button>
    <div class="aside-apply"><button class="btn p" id="asideApply" type="button"></button></div>
  </aside>

  <section>
    <div id="strips"></div>
    <div class="subbar" id="subbar"></div>
    <div class="bar">
      <h2><span id="ttl"></span><span id="cnt"></span></h2>
      <button class="chip mob-filter" id="mobF" style="align-items:center;gap:6px"><i data-lucide="sliders-horizontal"></i><span data-i="filters">Фильтры</span></button>
      <select id="sort">
        <option value="new" data-i="s_new"></option>
        <option value="cheap" data-i="s_cheap"></option>
        <option value="exp" data-i="s_exp"></option>
        <option value="deal" data-i="s_deal"></option>
        <option value="pop" data-i="s_pop"></option>
      </select>
      <button class="chip savebtn" id="saveS"><i data-lucide="bell"></i><span data-i="saveSearch"></span></button>
      <div class="vt"><button data-v="grid" class="on"><i data-lucide="layout-grid"></i></button><button data-v="list"><i data-lucide="list"></i></button><button data-v="map" data-it="map"><i data-lucide="map"></i></button></div>
    </div>
    <div class="crumbs" id="crumbs"></div>
    <div class="grid" id="grid"></div>
    <button class="more" id="more" data-i="showmore">Показать ещё</button>
  </section>
</div>

<footer><div class="wrap">
  <div class="cols">
    <div><div class="logo"><span class="mk"><i data-lucide="check"></i></span>gata<small>.md</small></div><p data-i="ftxt"></p></div>
    <div><h4 data-i="f1"></h4><ul><li><a href="#" data-i="about"></a></li><li><a href="#" data-i="blog"></a></li><li><a href="#" data-i="privacy"></a></li><li><a href="#" data-i="terms"></a></li></ul></div>
    <div><h4 data-i="f2"></h4><ul><li><a href="#" data-i="rules"></a></li><li><a href="#" data-i="safe"></a></li><li><a href="#" data-i="faq"></a></li><li><a href="#" data-i="report"></a></li></ul></div>
    <div><h4 data-i="f3"></h4><ul><li><a href="#" data-i="promo"></a></li><li><a href="#" data-i="shops"></a></li><li><a href="#" data-i="ads"></a></li><li><a href="#">hello@gata.md</a></li></ul></div>
  </div>
  <div class="cp"><span>© 2026 Gata.md</span><span data-i="demo"></span></div>
</div></footer>

<div class="drawer" id="drawer">
  <div class="dh"><span class="sp"><i data-lucide="sparkles"></i></span><div><b data-i="aiTitle"></b><small data-i="aiSub"></small></div><button class="x" id="aiClose"><i data-lucide="x"></i></button></div>
  <div class="msgs" id="msgs"></div>
  <form class="din" id="aiForm"><textarea id="aiIn" rows="1" data-ip="aiPh"></textarea><button id="aiSend"><i data-lucide="send"></i></button></form>
  <div class="mode" id="aiMode"></div>
</div>

<div class="ov" id="ov"><div class="md" id="md"></div></div>
<div class="scrim" id="scrim"></div>
<nav class="bnav" id="bnav">
  <button data-nav="home" class="on"><i data-lucide="house"></i><span data-i="nHome">Главная</span></button>
  <button data-nav="fav"><i data-lucide="heart"></i><span data-i="favs">Избранное</span><span class="badge" id="favN2" hidden>0</span></button>
  <button data-nav="post"><span class="plus"><i data-lucide="plus"></i></span></button>
  <button data-nav="msgs"><i data-lucide="message-circle"></i><span data-i="nMsgs">Чаты</span><span class="badge" id="msgN2" hidden>0</span></button>
  <button data-nav="cab"><i data-lucide="circle-user"></i><span data-i="nProfile">Профиль</span></button>
</nav>
<div class="toast" id="toast"><i data-lucide="circle-check"></i><span></span></div>

<script src="assets/js/icons.js"></script>
<script src="assets/js/catalog.js"></script>
<script src="assets/js/demo-data.js"></script>
<script src="assets/js/i18n.js"></script>
<script src="assets/js/app.js"></script>
<script src="assets/js/ai.js"></script>
<script src="assets/js/features.js"></script>
<script src="assets/js/events.js"></script>
<script src="assets/js/main.js"></script>
</body>
</html>
